name: Keep Appwrite Alive

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 UTC
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appwrite
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Appwrite-Project: ${{ secrets.APPWRITE_PROJECT_ID }}" \
            https://fra.cloud.appwrite.io/v1/health)
          echo "Appwrite responded with: $response"
          if [ "$response" -ge 500 ]; then
            echo "Appwrite might be down!"
            exit 1
          fi
